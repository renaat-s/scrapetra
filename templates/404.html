<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | ScrapeTra</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #030712; --text: #fff; --text2: rgba(255,255,255,.6); --blue: #3b82f6; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Instrument Sans", system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; }
    .container { padding: 2rem; }
    .code { font-size: 8rem; font-weight: 700; background: linear-gradient(135deg, var(--blue), #14b8a6); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; }
    h1 { font-size: 1.5rem; margin: 1rem 0 .5rem; background: none; -webkit-text-fill-color: #fff; color: #fff; }
    p { color: var(--text2); margin-bottom: 2rem; }
    a { display: inline-block; padding: 1rem 2.5rem; border-radius: 100px; background: var(--blue); color: #fff; font-weight: 700; text-decoration: none; transition: transform .3s; }
    a:hover { transform: scale(1.05); }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <a href="/">Back to ScrapeTra</a>
  </div>
</body>
</html>
